# Only serves Let's Encrypt HTTP-01 challenges for the public IP certificate.
# The WebConsole itself is never proxied over plaintext HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_IP_OR_HOST__;

    access_log __NGINX_LOG_DIR__/webconsole_acme_access.log;
    error_log  __NGINX_LOG_DIR__/webconsole_acme_error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root __ACME_WEBROOT__;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
